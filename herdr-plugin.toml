id = "nikisix.vi-marks"
name = "Vi Marks"
version = "0.4.0"
min_herdr_version = "0.9.5"
description = "Vi-style scrollback marks: m{a-z} sets, '{a-z} jumps across workspaces and panes, '' jumps back"
platforms = ["linux", "macos"]

[[actions]]
id = "prompt-set"
title = "Set mark (a-z)"
contexts = ["pane"]
command = ["python3", "marks.py", "prompt", "set"]

[[actions]]
id = "prompt-jump"
title = "Jump to mark (a-z or ')"
contexts = ["pane"]
command = ["python3", "marks.py", "prompt", "jump"]

[[actions]]
id = "prompt-show"
title = "Show marks"
contexts = ["pane"]
command = ["python3", "marks.py", "prompt", "show"]

[[panes]]
id = "key-reader"
title = "Mark"
placement = "popup"
width = "30%"
height = "10%"
command = ["python3", "marks.py", "read-key"]
